<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrol Labs | Sovereign Systems</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/style.css">

    <style>
        :root {
            --obsidian: #09090D;
            --steel-dark: #141421;
            --steel-mid: #252535;
            --steel-light: #7E8FA0;
            --fog-white: #C8C5BC;
            --crimson: #C41E3A;
            --neon-red: #FF2444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--obsidian);
            color: var(--fog-white);
            font-family: 'Geist Sans', sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* --- NAVBAR GRUESA E INDUSTRIAL --- */
        .navbar {
            padding: 45px 0; 
            position: absolute;
            width: 100%;
            z-index: 10;
            background-color: var(--obsidian);
            border-bottom: 1px solid var(--steel-dark);
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-group {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 20px;
        }

        .brand-logo { width: 48px; height: auto; }

        .brand-name {
            font-family: 'Geist Mono', monospace;
            font-weight: 800; 
            font-size: 1.5rem; 
            letter-spacing: 0.1em;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* --- TÍTULOS --- */
        h1 {
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 0.85;
            text-transform: uppercase;
            font-size: clamp(3.5rem, 12vw, 6.5rem);
            color: #ffffff;
            margin-bottom: 30px;
        }

        /* --- HERO SECTION --- */
        .hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            padding-top: 180px;
        }

        .hero-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(9, 9, 13, 0.8) 0%, var(--obsidian) 100%);
            z-index: -1;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--steel-light);
            max-width: 550px;
            margin-bottom: 50px;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        /* --- BOTÓN VARIANTE 3: FLUIDO ALQUÍMICO + GLOW + ECO --- */
        .btn-industrial {
            position: relative;
            display: inline-block;
            padding: 22px 55px;
            background: rgba(37, 37, 53, 0.3);
            backdrop-filter: blur(10px);
            border: 1px solid var(--steel-mid);
            color: #ffffff;
            text-decoration: none;
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            
            /* Muesca técnica */
            clip-path: polygon(0% 0%, 88% 0%, 100% 30%, 100% 100%, 0% 100%);
            
            /* Sombra sutil base (Crimson) */
            box-shadow: 0 0 15px rgba(196, 30, 58, 0.15), 
                        inset 0 0 10px rgba(196, 30, 58, 0.05);
            
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden; 
        }

        /* Span para mantener el texto por encima del gas */
        .btn-industrial span {
            position: relative;
            z-index: 1;
        }

        /* Efecto de Gas / Fluido expansivo */
        .btn-industrial::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Nace concentrado en la esquina inferior izquierda */
            background: radial-gradient(circle at bottom left, rgba(255, 36, 68, 0.6) 0%, transparent 60%);
            transform-origin: bottom left;
            animation: alchemyFluid 6s infinite cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 0;
        }

        /* Animación del fluido colisionando con los bordes */
        @keyframes alchemyFluid {
            0% { transform: scale(0); opacity: 0; }
            15% { opacity: 0.8; }
            50% { transform: scale(2.2); opacity: 0.2; } /* Se expande inundando el botón */
            80% { transform: scale(3); opacity: 0; }     /* Se disipa contra las paredes */
            100% { transform: scale(0); opacity: 0; }
        }

        /* Estado HOVER: Amplificación de la luz */
        .btn-industrial:hover {
            background: rgba(196, 30, 58, 0.2); 
            border-color: var(--neon-red);
            transform: translateY(-2px);
            /* Glow amplificado */
            box-shadow: 0 0 35px rgba(255, 36, 68, 0.4), 
                        inset 0 0 20px rgba(196, 30, 58, 0.3);
        }

        /* Estado CLICK (ACTIVE): Eco de luz extremo */
        .btn-industrial:active {
            transform: scale(0.95); /* Sensación de presión física */
            /* Explosión de luz (Eco) */
            box-shadow: 0 0 60px rgba(255, 36, 68, 0.8), 
                        0 0 100px rgba(255, 36, 68, 0.4), 
                        inset 0 0 40px rgba(255, 36, 68, 0.7);
            border-color: #ffffff; /* Destello en el borde */
            transition: box-shadow 0.1s ease-out, transform 0.1s ease-out; /* Reacción muy rápida */
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 35px;
        }

        @media (max-width: 768px) {
            .navbar { padding: 30px 0; }
            .brand-name { font-size: 1.1rem; }
            .brand-logo { width: 35px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container">
            <a href="#" class="brand-group">
                <img src="vlogo.webp" alt="Vitrol Logo" class="brand-logo">
                <span class="brand-name">VITROL LABS</span>
            </a>
            <nav>
                <div style="font-family: 'Geist Mono'; font-size: 0.7rem; color: var(--steel-light);">
                    // SYSTEM READY
                </div>
            </nav>
        </div>
    </header>

    <section class="hero">
        <video autoplay muted loop playsinline class="hero-video">
            <source src="obsidian2.mp4" type="video/mp4">
        </video>

        <div class="hero-overlay"></div>

        <div class="container">
            <h1>TRANSMUTING<br>DATA INTO<br>SOVEREIGN<br>SYSTEMS.</h1>
            <p>Destilamos automatización avanzada y biotecnología atávica en ecosistemas digitales soberanos.</p>
            
            <a href="#core" class="btn-industrial"><span>Explore the Lab</span></a>
        </div>
    </section>

</body>
</html>
