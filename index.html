<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrol Labs | Sovereign Systems</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/style.css">

    <style>
        :root {
            --obsidian: #09090D;
            --steel-dark: #141421;
            --steel-mid: #252535;
            --steel-light: #7E8FA0;
            --fog-white: #C8C5BC;
            --crimson: #C41E3A;
            --neon-red: #FF2444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--obsidian);
            color: var(--fog-white);
            font-family: 'Geist Sans', sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* --- NAVBAR GRUESA E INDUSTRIAL --- */
        .navbar {
            padding: 45px 0; 
            position: absolute;
            width: 100%;
            z-index: 10;
            background-color: var(--obsidian);
            border-bottom: 1px solid var(--steel-dark);
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-group {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 20px;
        }

        .brand-logo { width: 48px; height: auto; } /* Logo más grande */

        .brand-name {
            font-family: 'Geist Mono', monospace;
            font-weight: 800; 
            font-size: 1.5rem; 
            letter-spacing: 0.1em;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* --- CONFIGURACIÓN DE TÍTULOS --- */
        h1 {
            font-weight: 900;
            letter-spacing: -0.05em; /* Spacing -5% */
            line-height: 0.85;
            text-transform: uppercase;
            font-size: clamp(3.5rem, 12vw, 6.5rem);
            color: #ffffff;
            margin-bottom: 30px;
        }

        /* --- HERO SECTION --- */
        .hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            padding-top: 180px;
        }

        .hero-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(9, 9, 13, 0.8) 0%, var(--obsidian) 100%);
            z-index: -1;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--steel-light);
            max-width: 550px;
            margin-bottom: 50px;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        /* --- BOTÓN VARIANTE 3: INDUSTRIAL NOTCH + ESCÁNER --- */
        .btn-industrial {
            position: relative;
            display: inline-block;
            padding: 22px 55px;
            background: rgba(37, 37, 53, 0.3); /* Steel Mid con Glassmorfismo */
            backdrop-filter: blur(10px);
            border: 1px solid var(--steel-mid);
            color: #ffffff;
            text-decoration: none;
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            
            /* Muesca técnica en la esquina superior derecha */
            clip-path: polygon(0% 0%, 88% 0%, 100% 30%, 100% 100%, 0% 100%);
            
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden; /* Necesario para el efecto de escáner */
        }

        /* Efecto de Escáner (Barrido de Luz) */
        .btn-industrial::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(
                to right,
                transparent,
                rgba(255, 36, 68, 0.4), /* Neon Red */
                transparent
            );
            transform: skewX(-25deg);
            animation: scanner 5s infinite ease-in-out;
        }

        @keyframes scanner {
            0% { left: -100%; }
            20% { left: 120%; }
            100% { left: 120%; }
        }

        .btn-industrial:hover {
            background: rgba(196, 30, 58, 0.2); /* Tinte Crimson */
            border-color: var(--neon-red);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(255, 36, 68, 0.2);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 35px;
        }

        @media (max-width: 768px) {
            .navbar { padding: 30px 0; }
            .brand-name { font-size: 1.1rem; }
            .brand-logo { width: 35px; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container">
            <a href="#" class="brand-group">
                <img src="vlogo.webp" alt="Vitrol Logo" class="brand-logo">
                <span class="brand-name">VITROL LABS</span>
            </a>
            <nav>
                <div style="font-family: 'Geist Mono'; font-size: 0.7rem; color: var(--steel-light);">
                    // SYSTEM READY
                </div>
            </nav>
        </div>
    </header>

    <section class="hero">
        <video autoplay muted loop playsinline class="hero-video">
            <source src="obsidian2.mp4" type="video/mp4">
        </video>

        <div class="hero-overlay"></div>

        <div class="container">
            <h1>TRANSMUTING<br>DATA INTO<br>SOVEREIGN<br>SYSTEMS.</h1>
            <p>Destilamos automatización avanzada y biotecnología atávica en ecosistemas digitales soberanos.</p>
            
            <a href="#core" class="btn-industrial">Explore the Lab</a>
        </div>
    </section>

</body>
</html>
