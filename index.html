<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrol Labs | Sovereign Systems</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/style.css">

    <style>
        :root {
            --obsidian: #09090D;
            --steel-dark: #141421;
            --steel-mid: #252535;
            --steel-light: #7E8FA0;
            --fog-white: #C8C5BC;
            --crimson: #C41E3A;
            --neon-red: #FF2444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--obsidian);
            color: var(--fog-white);
            font-family: 'Geist Sans', sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* --- NAVBAR --- */
        .navbar {
            padding: 40px 0; 
            position: absolute;
            width: 100%;
            z-index: 10;
            background-color: var(--obsidian);
            border-bottom: 1px solid var(--steel-dark);
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-group {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 18px;
        }

        .brand-logo { width: 45px; height: auto; }

        .brand-name {
            font-family: 'Geist Mono', monospace;
            font-weight: 800; 
            font-size: 1.4rem; 
            letter-spacing: 0.15em;
            color: #ffffff;
            text-transform: uppercase;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 40px;
            align-items: center;
        }

        .nav-menu a {
            color: var(--fog-white);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: -0.03em;
        }

        /* --- HERO SECTION --- */
        .hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            padding-top: 150px;
        }

        .hero-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(9, 9, 13, 0.85) 0%, var(--obsidian) 100%);
            z-index: -1;
        }

        .hero h1 {
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 0.85;
            text-transform: uppercase;
            font-size: clamp(3.5rem, 12vw, 6.5rem);
            color: #ffffff;
            margin-bottom: 30px;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--steel-light);
            max-width: 500px;
            margin-bottom: 50px;
        }

        /* --- BOTÓN EXPLORE THE LAB (GLASSMORPHISM & GLOW) --- */
        .btn-glass-glow {
            display: inline-block;
            padding: 20px 60px;
            text-decoration: none;
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #ffffff;
            
            /* Forma Elíptica */
            border-radius: 100px;
            
            /* Glassmorphism */
            background: rgba(196, 30, 58, 0.1); /* Tinte Crimson muy suave */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            
            /* Borde sutil */
            border: 1px solid rgba(255, 36, 68, 0.3);
            
            /* Emisión de luz (Glow) */
            box-shadow: 0 0 20px rgba(196, 30, 58, 0.2), 
                        inset 0 0 12px rgba(255, 36, 68, 0.1);
            
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-glass-glow:hover {
            background: rgba(255, 36, 68, 0.2);
            border-color: var(--neon-red);
            
            /* Intensificación del brillo */
            box-shadow: 0 0 40px rgba(255, 36, 68, 0.5), 
                        0 0 10px rgba(255, 36, 68, 0.3);
            
            transform: translateY(-3px) scale(1.02);
            letter-spacing: 0.2em; /* Efecto expansivo */
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 30px;
        }

        @media (max-width: 768px) {
            .nav-menu { display: none; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container">
            <a href="#" class="brand-group">
                <img src="vlogo.webp" alt="Vitrol Logo" class="brand-logo">
                <span class="brand-name">VITROL LABS</span>
            </a>
            <nav>
                <ul class="nav-menu">
                    <li><a href="#core">01 DISTILL</a></li>
                    <li><a href="#core">02 BIO</a></li>
                    <li><a href="#projects">03 CODEX</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <video autoplay muted loop playsinline class="hero-video">
            <source src="obsidian2.mp4" type="video/mp4">
        </video>

        <div class="hero-overlay"></div>

        <div class="container">
            <h1>TRANSMUTING<br>DATA INTO<br>SOVEREIGN<br>SYSTEMS.</h1>
            <p>From digital to organic. High-end automation distilled into sovereign digital ecosystems.</p>
            
            <a href="#core" class="btn-glass-glow">Explore the Lab</a>
        </div>
    </section>

</body>
</html>
