<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitrol Labs | Sovereign Systems</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-mono/style.css">

    <style>
        :root {
            --obsidian: #09090D;
            --steel-dark: #141421;
            --steel-mid: #252535;
            --steel-light: #7E8FA0;
            --fog-white: #C8C5BC;
            --crimson: #C41E3A;
            --neon-red: #FF2444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--obsidian);
            color: var(--fog-white);
            font-family: 'Geist Sans', sans-serif;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* --- NAVBAR GRUESA Y OSCURA --- */
        .navbar {
            /* Incremento de grosor (padding vertical) */
            padding: 45px 0; 
            position: absolute;
            width: 100%;
            z-index: 10;
            /* Fondo sólido Obsidian con un borde inferior técnico */
            background-color: var(--obsidian);
            border-bottom: 1px solid var(--steel-dark);
        }

        .navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-group {
            display: flex;
            align-items: center;
            text-decoration: none;
            gap: 18px; /* Más espacio entre logo y texto */
        }

        /* Tamaño del Logo Incrementado */
        .brand-logo {
            width: 45px; 
            height: auto;
            display: block;
        }

        /* Texto de Marca en Geist Mono: Más Grande y Pesado */
        .brand-name {
            font-family: 'Geist Mono', monospace;
            font-weight: 800; 
            font-size: 1.4rem; 
            letter-spacing: 0.15em;
            color: #ffffff;
            text-transform: uppercase;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 40px;
            align-items: center;
        }

        /* Links de Navegación: Más Pesados y Espaciado Negativo */
        .nav-menu a {
            color: var(--fog-white);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 800; /* Peso aumentado */
            text-transform: uppercase;
            letter-spacing: -0.03em;
            transition: 0.3s;
        }

        .nav-menu a:hover {
            color: var(--neon-red);
        }

        .btn-connection {
            border: 2px solid var(--fog-white); /* Borde más grueso */
            padding: 12px 28px;
            font-weight: 900 !important;
            letter-spacing: 0.05em;
        }

        .btn-connection:hover {
            background-color: var(--neon-red);
            border-color: var(--neon-red);
        }

        /* --- HERO SECTION --- */
        .hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            overflow: hidden;
            padding-top: 180px; /* Compensa el grosor de la navbar */
        }

        .hero-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(9, 9, 13, 0.8) 0%, var(--obsidian) 100%);
            z-index: -1;
        }

        h1 {
            font-weight: 900;
            letter-spacing: -0.05em;
            line-height: 0.85;
            text-transform: uppercase;
            font-size: clamp(3.5rem, 12vw, 6.5rem);
            color: #ffffff;
            margin-bottom: 30px;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--steel-light);
            max-width: 500px;
            margin-bottom: 45px;
            font-weight: 500;
        }

        .btn-primary {
            display: inline-block;
            padding: 22px 50px;
            background-color: var(--neon-red);
            color: white;
            text-decoration: none;
            font-weight: 900;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: 0.3s;
        }

        .container {
            max-width: 1300px; /* Un poco más ancho para la nueva escala */
            margin: 0 auto;
            padding: 0 30px;
        }

        @media (max-width: 1024px) {
            .nav-menu { display: none; }
            .navbar { padding: 30px 0; }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="container">
            <a href="#" class="brand-group">
                <img src="vlogo.webp" alt="Vitrol Logo" class="brand-logo">
                <span class="brand-name">VITROL LABS</span>
            </a>
            <nav>
                <ul class="nav-menu">
                    <li><a href="#core">01 DISTILL</a></li>
                    <li><a href="#core">02 BIO</a></li>
                    <li><a href="#projects">03 CODEX</a></li>
                    <li><a href="#contact" class="btn-connection">INITIATE CONNECTION</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <video autoplay muted loop playsinline class="hero-video">
            <source src="obsidian2.mp4" type="video/mp4">
        </video>

        <div class="hero-overlay"></div>

        <div class="container">
            <h1>TRANSMUTING<br>DATA INTO<br>SOVEREIGN<br>SYSTEMS.</h1>
            <p>High-end automation and atavistic biotechnology distilled into sovereign digital ecosystems.</p>
            <a href="#core" class="btn-primary">Explore the Lab</a>
        </div>
    </section>

</body>
</html>
